plugins {
    alias(libs.plugins.androidApplication)
}

android {
    namespace 'com.example.facedetectionapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.facedetectionapp"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildToolsVersion '35.0.0'

    // Add this to prevent compression of .tflite files
    aaptOptions {
        noCompress "tflite"
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.litert.support.api
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation(libs.core.ktx)
    implementation(libs.face.detection)
    implementation(libs.camera.core)
    implementation(libs.camera.camera2)
    implementation(libs.androidx.camera.lifecycle)
    implementation(libs.androidx.camera.view)
    implementation 'com.google.mlkit:face-detection:16.1.5'

    // TensorFlow Lite for face anti-spoofing and recognition
    implementation 'com.google.ai.edge.litert:litert:1.0.1'
    implementation 'com.google.ai.edge.litert:litert-support-api:1.0.1'

    // RecyclerView and CardView for attendance list
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Material Design Components
    implementation 'com.google.android.material:material:1.12.0'

    // SQLite database (built-in Android)
    // No additional dependency needed for SQLite

    // Date and time utilities (built-in)
    // No additional dependency needed

    // Optional: Room database for more advanced database operations
    // implementation 'androidx.room:room-runtime:2.6.1'
    // annotationProcessor 'androidx.room:room-compiler:2.6.1'
}